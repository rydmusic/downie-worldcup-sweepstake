<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 World Cup Sweepstake</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <nav class="bg-slate-800 p-4 border-b border-slate-700 shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-amber-400">🏆 SWEEPSTAKE LIVE</h1>
            <span class="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full font-mono">Total Pot: £60</span>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 space-y-6">
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center text-sm bg-slate-800/50 border border-slate-700/60 rounded-xl p-4">
            <div><p class="text-slate-400">🥇 Winner</p><p class="text-lg font-bold text-amber-400">£35</p></div>
            <div><p class="text-slate-400">🥈 Runner Up</p><p class="text-lg font-bold text-slate-300">£10</p></div>
            <div><p class="text-slate-400">⚽ Most Scored</p><p class="text-lg font-bold text-emerald-400">£5</p></div>
            <div><p class="text-slate-400">🥅 Most Conceded</p><p class="text-lg font-bold text-red-400">£10</p></div>
        </div>

        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-xl">
            <div class="p-4 bg-slate-700/50 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold text-base tracking-wide flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span> 
                    Sofascore Live Fixtures & Sweeps
                </h3>
            </div>
            
            <div class="p-4 space-y-6">
                <div>
                    <h4 id="today-heading" class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Today</h4>
                    <div id="today-fixtures" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <p class="text-slate-500 text-xs italic py-2">Syncing with Sofascore...</p>
                    </div>
                </div>

                <div>
                    <h4 id="tomorrow-heading" class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Tomorrow</h4>
                    <div id="tomorrow-fixtures" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <p class="text-slate-500 text-xs italic py-2">Syncing with Sofascore...</p>
                    </div>
                </div>
            </div>
        </div>

        <h3 class="font-bold text-lg text-slate-300 pt-4">Standings Dashboard</h3>
        <div id="matrix-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <p class="text-slate-400 animate-pulse col-span-3 text-center py-12">Connecting to Sofascore data pipelines...</p>
        </div>
    </main>

    <script>
        const countryFlags = {
            "Algeria": "🇩🇿", "Canada": "🇨🇦", "Egypt": "🇪🇬", "Australia": "🇦🇺", "Congo DR": "🇨🇩", "Iraq": "🇮🇶", "Portugal": "🇵🇹", "Croatia": "🇭🇷",
            "Qatar": "🇶🇦", "Sweden": "🇸🇪", "Ivory Coast": "🇨🇮", "Ecuador": "🇪🇨", "Korea Republic": "🇰🇷", "Haiti": "🇭🇹", "England": "🏴󠁧󠁢󠁥󠁮󠁧󠁿", "Spain": "🇪🇸",
            "Switzerland": "🇨🇭", "Senegal": "🇸🇳", "Austria": "🇦🇹", "Uruguay": "🇺🇾", "Mexico": "🇲🇽", "Japan": "🇯🇵", "Colombia": "🇨🇴", "France": "🇫🇷",
            "Norway": "🇳🇴", "Jordan": "🇯🇴", "Paraguay": "🇵🇾", "Saudi Arabia": "🇸🇦", "South Africa": "🇿🇦", "Iran": "🇮🇷", "Brazil": "🇧🇷", "Belgium": "🇧🇪",
            "Scotland": "🏴󠁧󠁢󠁳󠁣󠁴󠁿", "Curacao": "🇨🇼", "Panama": "🇵🇦", "Czech Republic": "🇨🇿", "Tunisia": "🇹🇳", "New Zealand": "🇳🇿", "Argentina": "🇦🇷", "Morocco": "🇲🇦",
            "Turkey": "🇹🇷", "Bosnia & Herzegovina": "🇧🇦", "Uzbekistan": "🇺🇿", "Ghana": "🇬🇭", "Cape Verde": "🇨🇻", "USA": "🇺🇸", "Germany": "🇩🇪", "Netherlands": "🇳🇱"
        };

        const sweepstakeData = [
          { player: "Archie", teams: ["Algeria", "Canada", "Egypt", "Australia", "Congo DR", "Iraq", "Portugal", "Croatia"] },
          { player: "Bea", teams: ["Qatar", "Sweden", "Ivory Coast", "Ecuador", "Korea Republic", "Haiti", "England", "Spain"] },
          { player: "Craig", teams: ["Switzerland", "Senegal", "Austria", "Uruguay", "Mexico", "Japan", "Colombia", "France"] },
          { player: "Emily", teams: ["Norway", "Jordan", "Paraguay", "Saudi Arabia", "South Africa", "Iran", "Brazil", "Belgium"] },
          { player: "Laura", teams: ["Scotland", "Curacao", "Panama", "Czech Republic", "Tunisia", "New Zealand", "Argentina", "Morocco"] },
          { player: "Ryan", teams: ["Turkey", "Bosnia & Herzegovina", "Uzbekistan", "Ghana", "Cape Verde", "USA", "Germany", "Netherlands"] }
        ];

        const API_KEY = "64728c7362msh877fb4fa9f8687dp1e1476jsncf45c0b51895";
        const SOFASCORE_HOST = "sofascore.p.rapidapi.com";
        const WORLD_CUP_UNIQUE_ID = 16; // Sofascore's internal code designation for the FIFA World Cup tournament

        function getOwner(teamName) {
            const found = sweepstakeData.find(p => p.teams.includes(teamName));
            return found ? found.player : "No Owner";
        }

        let teamStats = {};
        sweepstakeData.forEach(player => {
            player.teams.forEach(team => {
                teamStats[team] = { scored: 0, conceded: 0 };
            });
        });

        function buildFixtureHTML(match, timeString) {
            const homeFlag = countryFlags[match.home] || "🏳️";
            const awayFlag = countryFlags[match.away] || "🏳️";

            let statusBadge = `<span class="bg-slate-700 text-slate-300 px-2 py-0.5 rounded text-xs font-mono font-bold">${match.status}</span>`;
            if (match.status === 'inprogress') {
                statusBadge = `<span class="bg-red-500/20 text-red-400 border border-red-500/30 px-2 py-0.5 rounded text-xs font-mono font-bold animate-pulse">LIVE</span>`;
            } else if (match.status === 'finished') {
                statusBadge = `<span class="bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded text-xs font-mono font-bold">FT</span>`;
            }

            return `
                <div class="bg-slate-900/60 border border-slate-700/50 rounded-xl p-4 flex flex-col justify-between items-center space-y-3">
                    <div class="flex items-center justify-between w-full text-xs text-slate-400">
                        <span>Kickoff: ${timeString}</span>
                        ${statusBadge}
                    </div>
                    <div class="flex justify-between items-center w-full px-2">
                        <div class="text-center w-5/12">
                            <p class="font-bold text-sm md:text-base text-slate-100 truncate">${homeFlag} ${match.home}</p>
                            <p class="text-[10px] text-amber-400 font-medium tracking-wide uppercase mt-0.5">👤 ${getOwner(match.home)}</p>
                        </div>
                        <div class="w-2/12 text-center font-mono font-black text-lg text-emerald-400 bg-slate-900 px-3 py-1 rounded-lg border border-slate-700/40">
                            ${match.homeScore}-${match.awayScore}
                        </div>
                        <div class="text-center w-5/12">
                            <p class="font-bold text-sm md:text-base text-slate-100 truncate">${awayFlag} ${match.away}</p>
                            <p class="text-[10px] text-amber-400 font-medium tracking-wide uppercase mt-0.5">👤 ${getOwner(match.away)}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        async function fetchMatchesByDate(dateObject) {
            const yyyy = dateObject.getFullYear();
            const mm = String(dateObject.getMonth() + 1).padStart(2, '0');
            const dd = String(dateObject.getDate()).padStart(2, '0');
            const formattedDate = `${yyyy}-${mm}-${dd}`;

            const url = `https://${SOFASCORE_HOST}/matches/get-by-date?date=${formattedDate}`;
            const options = {
                method: 'GET',
                headers: {
                    'X-RapidAPI-Key': API_KEY,
                    'X-RapidAPI-Host': SOFASCORE_HOST
                }
            };

            try {
                const response = await fetch(url, options);
                const data = await response.json();
                const events = data.events || [];

                // Keep only World Cup tournament matches
                return events.filter(event => event.tournament && event.tournament.uniqueId === WORLD_CUP_ID);
            } catch (error) {
                console.error(`Sofascore fetch error for date ${formattedDate}:`, error);
                return [];
            }
        }

        async function initSofascoreSync() {
            const today = new Date();
            const tomorrow = new Date();
            tomorrow.setDate(today.getDate() + 1);

            document.getElementById('today-heading').innerText = `Today (${today.toLocaleDateString('en-GB', {day: 'numeric', month: 'short'})})`;
            document.getElementById('tomorrow-heading').innerText = `Tomorrow (${tomorrow.toLocaleDateString('en-GB', {day: 'numeric', month: 'short'})})`;

            // Fire parallel background requests for both target dates
            const [todayEvents, tomorrowEvents] = await Promise.all([
                fetchMatchesByDate(today),
                fetchMatchesByDate(tomorrow)
            ]);

            let todayHTML = '';
            let tomorrowHTML = '';

            // Process matches from today's feed array
            todayEvents.forEach(event => {
                const homeTeam = event.homeTeam.name;
                const awayTeam = event.awayTeam.name;
                const homeScore = event.homeScore?.current ?? 0;
                const awayScore = event.awayScore?.current ?? 0;

                if (teamStats[homeTeam]) {
                    teamStats[homeTeam].scored += homeScore;
                    teamStats[homeTeam].conceded += awayScore;
                }
                if (teamStats[awayTeam]) {
                    teamStats[awayTeam].scored += awayScore;
                    teamStats[awayTeam].conceded += homeScore;
                }

                const matchTime = new Date(event.startTimestamp * 1000).toLocaleTimeString('en-GB', {hour: '2-digit', minute:'2-digit'});
                todayHTML += buildFixtureHTML({
                    home: homeTeam, away: awayTeam, homeScore: homeScore, awayScore: awayScore, status: event.status.type
                }, matchTime);
            });

            // Process matches from tomorrow's feed array
            tomorrowEvents.forEach(event => {
                const homeTeam = event.homeTeam.name;
                const awayTeam = event.awayTeam.name;
                const homeScore = event.homeScore?.current ?? 0;
                const awayScore = event.awayScore?.current ?? 0;

                const matchTime = new Date(event.startTimestamp * 1000).toLocaleTimeString('en-GB', {hour: '2-digit', minute:'2-digit'});
                tomorrowHTML += buildFixtureHTML({
                    home: homeTeam, away: awayTeam, homeScore: homeScore, awayScore: awayScore, status: event.status.type
                }, matchTime);
            });

            document.getElementById('today-fixtures').innerHTML = todayHTML || `<p class="text-slate-500 text-xs italic py-2">No World Cup matches scheduled for today.</p>`;
            document.getElementById('tomorrow-fixtures').innerHTML = tomorrowHTML || `<p class="text-slate-500 text-xs italic py-2">No World Cup matches scheduled for tomorrow.</p>`;

            renderDashboard();
        }

        function renderDashboard() {
            const grid = document.getElementById('matrix-grid');
            grid.innerHTML = '';
            
            sweepstakeData.forEach(playerData => {
                let playerCard = `
                    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md">
                        <h2 class="text-xl font-bold text-amber-400 border-b border-slate-700 pb-2 mb-3">${playerData.player}</h2>
                        <ul class="space-y-2">
                `;
                
                playerData.teams.forEach(teamName => {
                    const stats = teamStats[teamName] || { scored: 0, conceded: 0 };
                    const flag = countryFlags[teamName] || "🏳️";
                    playerCard += `
                        <li class="flex justify-between items-center text-sm p-2 bg-slate-900/40 rounded border border-slate-700/30">
                            <span class="text-slate-200 font-medium">${flag} ${teamName}</span>
                            <div class="space-x-2 text-xs font-mono">
                                <span class="text-emerald-400">⚽ ${stats.scored}</span>
                                <span class="text-red-400">🥅 ${stats.conceded}</span>
                            </div>
                        </li>
                    `;
                });
                
                playerCard += `</ul></div>`;
                grid.innerHTML += playerCard;
            });
        }

        // Initialize execution on runtime loop
        initSofascoreSync();
    </script>
</body>
</html>
